<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLAMS</title>
<style>
  :root { --bg:#f4f6f8; --ink:#1b2430; --muted:#5b6675; --line:#d3dae3; --accent:#1f6f5c; --accent-ink:#fff; --bad:#b3261e; --good:#1f6f3a; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --ink:#e8edf2; --muted:#9aa6b5; --line:#2b3440; --accent:#4cb89c; --accent-ink:#0b1410; --bad:#ff8a80; --good:#7fd69a; --card:#1a2129; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.6rem; margin:0 0 4px; letter-spacing:-0.01em; }
  h2 { font-size:1.15rem; margin:28px 0 10px; }
  p { margin:6px 0; }
  .muted { color:var(--muted); font-size:.92rem; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px; }
  label { display:block; font-weight:600; margin:12px 0 4px; font-size:.95rem; }
  input, select { width:100%; padding:10px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }
  button { font:inherit; font-weight:600; padding:10px 16px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.danger { color:var(--bad); border-color:var(--bad); }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button:disabled { opacity:.6; cursor:wait; }
  .bar { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin:12px 0 4px; }
  .tabs button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .line { display:grid; grid-template-columns:28px 1fr; gap:8px; padding:12px 0; border-top:1px solid var(--line); }
  .line .no { font-weight:700; padding-top:10px; color:var(--muted); }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .fields .wide { grid-column:1 / -1; }
  .fields label { margin:0 0 2px; font-weight:500; font-size:.85rem; color:var(--muted); }
  @media (max-width:520px) { .fields { grid-template-columns:1fr; } }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .ok { color:var(--good); } .err { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th, td { text-align:left; padding:5px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .wrap { overflow-x:auto; }
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
  .card b{font-size:1.5rem;display:block}
  details.dd { margin:14px 0; } details.dd > summary { font-size:1.12rem; font-weight:700; cursor:pointer; margin:6px 0 8px; list-style:revert; }
  details.dd > summary::marker { color:var(--accent); }
  button.danger { color:var(--bad); border-color:var(--bad); }
  @media print { body * { visibility:hidden; } #regout, #regout * { visibility:visible; } #regout { position:absolute; left:0; top:0; width:100%; } }
  td button { padding:4px 9px; font-size:.82rem; }
  .qr { text-align:center; margin:12px 0; }
  .qr img { width:min(320px,100%); height:auto; image-rendering:pixelated; background:#fff; padding:8px; border-radius:6px; }
  .flag { font-size:.8rem; padding:2px 6px; border:1px solid var(--line); border-radius:4px; color:var(--muted); }
  .sess { margin-top:14px; }
  .check { display:flex; gap:8px; align-items:center; margin:6px 0; font-weight:400; }
  .check input { width:auto; }
  main.wide { max-width:1040px; }
  [hidden] { display:none !important; }
  .shell { display:grid; grid-template-columns:180px 1fr; gap:24px; margin-top:8px; }
  .side { position:sticky; top:12px; align-self:start; display:flex; flex-direction:column; gap:4px; }
  .side button { text-align:left; border:0; background:none; padding:9px 12px; border-radius:6px; }
  .side button[aria-current="true"] { background:var(--accent); color:var(--accent-ink); }
  @media (max-width:700px) { .shell { grid-template-columns:1fr; } .side { position:static; flex-direction:row; overflow-x:auto; } .side button { white-space:nowrap; } }
  .rel { position:relative; } .pen { position:absolute; top:10px; right:10px; }
  button.icon, td button.icon { padding:2px 9px; font-size:1.05rem; line-height:1.3; }
  .kv { display:grid; grid-template-columns:140px 1fr; gap:6px 12px; margin:0; } .kv dt { color:var(--muted); } .kv dd { margin:0; }
  /* ---- Visual refresh: warm colours, softer cards, clearer spacing ---- */
  :root { --bg:#f7f8f5; --card:#ffffff; --ink:#1f2a24; --muted:#5d6b63; --line:#dfe5df; --accent:#1f6f5c; --accent-ink:#ffffff; --bad:#b42318; --good:#1f6f3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111815; --card:#18211d; --ink:#e6ede9; --muted:#9bb0a6; --line:#2a3832; --accent:#4cb89c; --accent-ink:#0b1410; --bad:#ff8a80; --good:#7fd69a; }
  }
  body { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; line-height: 1.55; }
  main { padding: 28px 22px 72px; }
  h1 { font-size: 1.55rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.08rem; margin: 30px 0 12px; }
  .panel { border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); padding: 18px; margin-bottom: 12px; }
  button { border-radius: 8px; transition: background .15s, border-color .15s, filter .15s; }
  button:hover { filter: brightness(0.96); }
  button.primary:hover { filter: brightness(1.08); }
  input, select, textarea { border-radius: 8px; }
  .side button { border-radius: 10px; }
  .side button[aria-current="true"] { box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
  .flag { border-radius: 999px; }
  .avatar { display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-weight:700; margin-right:12px; vertical-align:middle; }
  #chatbtn { width:48px !important; height:48px !important; }
  @media (max-width: 700px) { main { padding: 18px 14px 84px; } }
</style>
</head>
<body>
<main id="app">Loading…</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ===== Put your two Supabase values between the quotes, then save the file ===== */
const SUPABASE_URL = "https://ixruysckppyntpcmjnun.supabase.co";
const SUPABASE_KEY = "sb_publishable_XbYBjAcFqvNhp7nlxoo1Aw_x7xn0Hlz";
/* ================================================================================= */

/* Heading lines printed at the top of the attendance register */
const INSTITUTION = ["SIKIRU ADETONA COLLEGE OF EDUCATION, SCIENCE AND TECHNOLOGY, OMU-AJOSE, OGUN STATE",
                     "(IN AFFILIATION WITH OLABISI ONABANJO UNIVERSITY, AGO-IWOYE)"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
// Same rule as the database: lower-case, runs of symbols become "-", then @dlams.app
const loginEmail = s => s.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-") + "@dlams.app";
const MODES = { degree: "Degree", nce_dual: "NCE / Dual Mandate" };
const ROUTES = { utme: "UTME", direct_entry: "Direct Entry" };
const AUDS = { all: "Everyone", utme: "UTME only", direct_entry: "Direct Entry only" };
const modeLine = p => (MODES[p.study_mode] || "") + " - " + (ROUTES[p.admission_route] || "");

let pendingToken = new URLSearchParams(location.search).get("s");
let me = null;        // { prof, roles, cls }
let tab = "student";
let mode = "degree";
let lines = [];
const blank = () => ({ code: "", title: "", name: "", lid: "", aud: "all" });

function show(html) {
  $("app").innerHTML = html; $("app").className = "";
  const h = $("app").querySelector("h1");
  if (h && me && me.prof && me.prof.full_name) {
    const ini = me.prof.full_name.split(/[\s,]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
    const av = document.createElement("span"); av.className = "avatar"; av.setAttribute("aria-hidden", "true"); av.textContent = ini;
    h.parentNode.insertBefore(av, h);
  }
}

/* ---------- Sign in ---------- */
function renderLogin(message) {
  show(`
    <h1>DLAMS</h1>
    <p class="muted">Digital Lecture Attendance Management System</p>
    ${pendingToken ? `<p><strong>Sign in to register your attendance.</strong></p>` : ""}
    <form class="panel" style="margin-top:20px" onsubmit="doLogin(event)">
      <label for="lid">Matric number or DLAMS ID</label>
      <input id="lid" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="primary" id="go">Sign in</button></div>
      <p class="err" id="lerr" role="alert">${esc(message || "")}</p>
    </form>
    <p style="margin-top:16px">New student? <button type="button" onclick="renderRegister()">Register here</button></p>
    <details style="margin-top:12px"><summary>Forgot password?</summary><p class="muted">Contact your HOC or the administrator to get a new password.</p></details>`);
}

async function doLogin(e) {
  e.preventDefault();
  $("go").disabled = true; $("lerr").textContent = "";
  const { data: em } = await sb.rpc("login_email_for", { p_login: $("lid").value.trim() });
  const { error } = await sb.auth.signInWithPassword({ email: em || loginEmail($("lid").value), password: $("pw").value });
  if (error) { renderLogin("We could not sign you in. Check your ID and password and try again."); return; }
  await loadMe();
}

async function signOut() { stopTimers(); await sb.auth.signOut(); me = null; const w = $("chatw"); if (w) w.remove(); renderLogin(); }

/* ---------- Load the signed-in person ---------- */
async function loadMe() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return renderLogin();
  const { data: prof } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if (!prof) { show(`<p>Your account has no DLAMS profile yet. Ask the administrator.</p><button onclick="signOut()">Sign out</button>`); return; }
  if (prof.must_change_password) { renderChangePassword(); return; }
  const { data: roles } = await sb.from("role_assignments").select("role,slot,class_profile_id").eq("profile_id", user.id).eq("is_active", true);
  const hoc = (roles || []).find(r => r.role === "hoc_cg");
  let cls = null;
  if (hoc) { const r = await sb.from("class_profiles").select("*").eq("id", hoc.class_profile_id).maybeSingle(); cls = r.data; }
  me = { prof, roles: roles || [], hoc, cls, staff: prof.account_type === "staff" };
  tab = me.hoc ? "hoc" : "student";
  lines = [blank()];
  if (me.roles.some(r => r.role === "admin")) { renderAdminDash(); return; }
  ensureChatWidget();
  if (me.staff) { renderStaff(); return; }
  pendingToken ? renderScan() : renderHome();
}

function renderHome() {
  stopTimers();
  const p = me.prof;
  const tabs = me.hoc ? `<div class="tabs" role="group" aria-label="Switch dashboard">
      <button aria-pressed="${tab === "student"}" onclick="setTab('student')">Student</button>
      <button aria-pressed="${tab === "hoc"}" onclick="setTab('hoc')">${me.hoc.slot === "main" ? "HOC/CG" : "Assistant HOC/CG"}</button>${isAdmin() ? `<button onclick="renderAdminDash()">Administrator</button>` : ""}</div>` : "";
  show(`
    <div class="bar">
      <div><h1>${esc(p.full_name)}</h1>
        <p class="muted">${esc(p.login_id)}${me.hoc && p.hoc_cg_id ? " · " + (me.hoc.slot === "main" ? "HOC/CG" : "Assistant HOC/CG") + " ID " + esc(p.hoc_cg_id) : ""}</p></div>
      <button onclick="signOut()">Sign out</button>
    </div>${tabs}<div id="view"></div>`);
  $("app").className = tab === "hoc" ? "wide" : "";
  tab === "hoc" ? renderHoc() : renderStudent();
  if (me.hoc) loadAppointedBy();
}
function setTab(t) { tab = t; renderHome(); }

/* ---------- Student view ---------- */
const semLabel = s => s === "first" ? "Harmattan Semester" : s === "second" ? "Rain Semester" : s;
let flash = "", editingMe = false;
async function renderStudent() {
  const p = me.prof;
  const { data: cls } = await sb.from("class_profiles").select("id,programme,level,session,semester,school_id").eq("is_active", true).order("level");
  const mineCls = (cls || []).find(c => c.id === p.class_profile_id), sameSchool = (cls || []).filter(c => mineCls && c.school_id === mineCls.school_id);
  let html = (flash ? `<p class="ok" role="status">${esc(flash)}</p>` : "") + `<h2>My courses</h2>`; flash = "";
  if (p.status === "active") {
    const { data } = await sb.rpc("my_courses");
    const rows = data || [], KIND = { carryover: "Carryover", de_requirement: "Direct Entry requirement" };
    html += rows.length ? `<div class="panel wrap"><table><tr><th>Code</th><th>Title</th><th>Lecturer</th><th></th></tr>${rows.map(c =>
        `<tr><td>${esc(c.course_code)}</td><td>${esc(c.course_title)}</td><td>${esc(c.lecturer_name)}</td>
         <td>${c.kind === "core" ? "" : `<span class="flag">${KIND[c.kind]}</span> <button onclick="dropExtra('${c.course_id}')">Remove</button>`}</td></tr>`).join("")}</table></div>`
      : `<p class="panel">No courses have been added for your class yet.</p>`;
    html += `<div class="panel" style="margin-top:12px"><strong>Extra courses</strong>
      <p class="muted">Carryovers, and the lower-level courses a Direct Entry student must take. They are added straight away, and the HOC/CG who owns the course will see you on their list.</p>
      <div class="actions"><button onclick="loadExtras()">Add an extra course</button></div><div id="xopts"></div></div>`;
    html += `<h2>My attendance</h2><div id="myatt"></div>`;
  } else {
    html += `<p class="panel">${{ pending: "Your registration is waiting for approval from your class HOC/CG. You can correct your details below.",
      denied: "Your registration was denied. Correct your details below and save to send it again.",
      suspended: "Your account is suspended. Please contact your HOC/CG." }[p.status] || ""}</p>`;
  }
  const mine = (cls || []).find(c => c.id === p.class_profile_id);
  const classOpts = sameSchool.map(c => `<option value="${c.id}" ${c.id === p.class_profile_id ? "selected" : ""}>${esc(c.programme)}, ${c.level} Level, ${esc(c.session)} ${semLabel(c.semester)}</option>`).join("");
  html += `<h2>My account</h2><div class="panel rel">` + (editingMe ? `<div class="fields">
      <div class="wide"><label for="sn">Full name</label><input id="sn" value="${esc(p.full_name)}"></div>
      <div><label for="sm">Matric number</label><input id="sm" value="${esc(p.login_id)}"></div>
      <div><label for="sp">Phone</label><input id="sp" type="tel" value="${esc(p.phone)}"></div>
      <div><label for="sl">Current level</label><select id="sl">${[100, 200, 300, 400].map(l => `<option value="${l}" ${l === p.current_level ? "selected" : ""}>${l} Level</option>`).join("")}</select></div>
      <div><label for="sk">Study mode</label><select id="sk">${Object.entries(MODES).map(([k, v]) => `<option value="${k}" ${k === p.study_mode ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div><label for="sr">How you were admitted</label><select id="sr">${Object.entries(ROUTES).map(([k, v]) => `<option value="${k}" ${k === p.admission_route ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="wide"><label for="sc">Department</label><select id="sc">${classOpts}</select></div>
    </div>
    <p class="muted">Changing your matric number, class, level or how you were admitted needs your HOC/CG to approve it again.</p>
    <div class="actions"><button class="primary" id="sv" onclick="saveMe()">${p.status === "denied" ? "Save and resubmit" : "Save changes"}</button>
      <button onclick="editMe(false)">Cancel</button></div><p id="smsg2" role="status"></p>`
    : `<button class="icon pen" aria-label="Edit my details" title="Edit my details" onclick="editMe(true)">&#9998;</button>
      <dl class="kv"><dt>Full name</dt><dd>${esc(p.full_name)}</dd><dt>Matric number</dt><dd>${esc(p.login_id)}</dd>
      <dt>Phone</dt><dd>${esc(p.phone) || "-"}</dd><dt>Level</dt><dd>${p.current_level} Level</dd>
      <dt>Study mode</dt><dd>${MODES[p.study_mode] || ""}</dd><dt>Admitted through</dt><dd>${ROUTES[p.admission_route] || ""}</dd>
      <dt>Department</dt><dd>${mine ? esc(mine.programme) + ", " + mine.level + " Level, " + esc(mine.session) + " " + semLabel(mine.semester) : ""}</dd></dl>`) + `</div>
    <details style="margin-top:16px"><summary>Delete my account</summary>
      <p class="muted">This permanently removes your account and details. It is not possible once you have attendance records.</p>
      <button onclick="deleteAccount()">Delete my account</button><p id="dmsg" role="status"></p></details>`;
  $("view").innerHTML = html + (p.status === "active" ? '<h2>Announcements</h2><div id="annc"></div><h2>Lecturers\' timetable</h2><div id="stt"></div>' : "");
  if (p.status === "active") { loadMyAttendance(); loadAnnouncements(); loadStudentTimetable(); }
}

function editMe(on) { editingMe = on; renderStudent(); }

async function saveMe() {
  const m = $("smsg2"), was = me.prof.status; $("sv").disabled = true; m.className = ""; m.textContent = "";
  const { data, error } = await sb.rpc("update_my_profile", { p_name: $("sn").value, p_phone: $("sp").value,
    p_class: $("sc").value, p_level: +$("sl").value, p_route: $("sr").value, p_mode: $("sk").value, p_login: $("sm").value });
  if (error) { $("sv").disabled = false; m.className = "err"; m.textContent = error.message; return; }
  const { data: np } = await sb.from("profiles").select("*").eq("id", me.prof.id).single(); me.prof = np;
  flash = (data === "pending" && was !== "pending") ? "Saved. Your HOC/CG must approve the change." : "Saved.";
  editingMe = false; renderHome();
}

async function loadExtras() {
  const box = $("xopts"), { data, error } = await sb.rpc("extra_course_options");
  if (error) { box.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  box.innerHTML = (data && data.length) ? `<div class="wrap" style="margin-top:8px"><table><tr><th>Level</th><th>Code</th><th>Title</th><th>Lecturer</th><th></th></tr>${data.map(c =>
    `<tr><td>${c.level}</td><td>${esc(c.course_code)}</td><td>${esc(c.course_title)}</td><td>${esc(c.lecturer_name)}</td>
     <td><button class="primary" onclick="addExtra('${c.course_id}')">Add</button></td></tr>`).join("")}</table></div>`
    : `<p class="muted">There are no lower-level courses available to add right now.</p>`;
}
async function addExtra(id) {
  const { error } = await sb.rpc("add_extra_course", { p_course: id });
  if (error) { $("xopts").insertAdjacentHTML("afterbegin", `<p class="err">${esc(error.message)}</p>`); return; }
  flash = "Extra course added."; renderStudent();
}
async function dropExtra(id) {
  if (!confirm("Remove this extra course from your list?")) return;
  const { error } = await sb.rpc("drop_extra_course", { p_course: id }); if (!error) renderStudent();
}

async function deleteAccount() {
  if (prompt("To delete your account, type DELETE") !== "DELETE") return;
  const { error } = await sb.rpc("delete_my_account");
  if (error) { $("dmsg").className = "err"; $("dmsg").textContent = error.message; return; }
  await sb.auth.signOut(); me = null; renderLogin("Your account has been deleted.");
}

/* ---------- HOC/CG: Add courses ---------- */
const isMain = () => (!!me && !!me.staff) || (!!me.hoc && (me.hoc.slot === "main" || me.roles.some(r => r.role === "admin")));
let curSec = "attendance";
function sec(n) {
  curSec = n;
  document.querySelectorAll("[id^='sec-']").forEach(e => { e.hidden = e.id !== "sec-" + n; });
  document.querySelectorAll(".side button").forEach(b => b.setAttribute("aria-current", String(b.id === "nv-" + n)));
}
function renderHoc() {
  const c = me.cls, main = isMain();
  if (!main && curSec === "assistants") curSec = "attendance";
  if (curSec === "admin" && !isAdmin()) curSec = "attendance";
  $("view").innerHTML = `
    ${me.hoc.slot !== "main" ? `<p class="panel">You are signed in as an <strong>Assistant HOC/CG</strong>. You can approve students and mark attendance. The HOC/CG handles courses and the QR code.</p>` : ""}
    <div class="shell"><nav class="side" aria-label="HOC/CG menu">
      <button id="nv-attendance" onclick="sec('attendance')">Attendance</button>
      <button id="nv-students" onclick="sec('students')">Students</button>
      <button id="nv-courses" onclick="sec('courses')">Courses</button>
      ${main ? `<button id="nv-assistants" onclick="sec('assistants')">Assistants</button>` : ""}
      <button id="nv-records" onclick="sec('records')">Records</button>
      ${isAdmin() ? `<button id="nv-admin" onclick="sec('admin'); loadAdmin()">Administrator</button>` : ""}
      ${isAdmin() ? `<button id="nv-inbox" onclick="sec('inbox'); loadInbox()">&#128276; Inbox <span id="inbcount"></span></button>` : ""}</nav>
    <div>
      <p class="muted" style="margin-top:0">${c ? esc(c.programme) + ", " + c.level + " Level, " + esc(c.session) + ", " + semLabel(c.semester) : ""}</p>
      <section id="sec-attendance"><h2 style="margin-top:8px">Attendance sessions</h2>
        ${main ? `<div id="screate"></div>` : ""}<p id="gmsg" role="status"></p><div id="slist"></div></section>
      <section id="sec-students"><div id="sedit"></div><div id="pend"></div><div id="cls"></div><div id="xtra"></div><div id="dept"></div></section>
      <section id="sec-courses">${main ? `<h2 style="margin-top:8px">Add courses</h2>

async function checkLecturer(i) {
  const box = $("k" + i), id = lines[i].lid.trim();
  if (!id) { box.textContent = ""; return; }
  const { data, error } = await sb.rpc("lookup_lecturer", { p_id: id });
  if (error) { box.innerHTML = `<span class="err">${esc(error.message)}</span>`; return; }
  box.innerHTML = data ? `<span class="ok">Registered lecturer: ${esc(data)}. Check this is the right person.</span>`
                       : `<span class="err">No active lecturer has this DLAMS ID.</span>`;
}

async function saveLines() {
  const msg = $("msg"); msg.className = ""; msg.textContent = "";
  const todo = lines.map((l, i) => [l, i]).filter(([l]) => l.code || l.title || l.name || l.lid);
  if (!todo.length) { msg.className = "err"; msg.textContent = "Fill in at least one course line."; return; }
  const gen = $("cat") && $("cat").value === "gen";
  const host = gen ? $("gdep").value : null;
  if (gen && (!host || !window._gen || !window._gen.hosts.has(host))) {
    msg.className = "err"; msg.textContent = "Choose a hosting school and a department that hosts general courses."; return;
  }
  $("save").disabled = true;
  const fails = [], notes = []; let ok = 0;
  for (const [l, i] of todo) {
    const r = gen
      ? await sb.rpc("add_general_course", { p_class: me.hoc.class_profile_id, p_mode: mode, p_audience: l.aud || "all", p_code: l.code, p_title: l.title, p_host: host })
      : await sb.rpc("add_course", { p_class: me.hoc.class_profile_id, p_mode: mode, p_audience: l.aud || "all", p_code: l.code, p_title: l.title, p_lecturer_name: l.name, p_lecturer_id: l.lid.trim() || null });
    if (r.error) { fails.push("Line " + (i + 1) + ": " + r.error.message); continue; }
    l.done = true; ok++;
    if (!gen && r.data && r.data.note) notes.push(esc(l.code) + ": " + esc(r.data.note));
  }
  lines = lines.filter(l => !l.done); if (!lines.length) lines = [blank()];
  drawLines(); $("save").disabled = false;
  msg.className = fails.length ? "err" : "ok";
  msg.innerHTML = (ok ? `Saved ${ok} course${ok > 1 ? "s" : ""}. ` : "") + fails.map(esc).join("<br>") + (notes.length ? "<br>" + notes.join("<br>") : "");
  loadSaved();
}

async function removeCourse(id) {

  let { error } = await sb.rpc("remove_course", { p_course: id });
  if (error && /attendance sessions/.test(error.message) && isAdmin()) {
    if (prompt("This course has lecture records. Deleting it will ALSO delete all of its attendance records for good.\n\nType the course code (" + c.course_code + ") to confirm:") !== c.course_code) { loadSaved(); return; }

/* Each choice narrows the next; the first valid option is picked automatically */
function regPick(level, val) {
  const R = window._reg, S = R.sel;
  const o = (a, f) => a.length ? a.map(f).join("") : `<option value="">None available yet</option>`;
  if (level === "school") S.school = val;
  if (level === "dept") S.dept = val;
  if (level === "sess") S.sess = val;
  if (level === "level") S.level = +val;
  if (level === "sem") S.sem = val;
  const depts = R.depts.filter(d => d.school_id === S.school);
  if (!depts.some(d => d.id === S.dept)) S.dept = depts.length ? depts[0].id : "";
  $("rschool").innerHTML = o(R.schools, s => `<option value="${s.id}" ${s.id === S.school ? "selected" : ""}>${esc(s.name)}</option>`);
  $("rdept").innerHTML = o(depts, d => `<option value="${d.id}" ${d.id === S.dept ? "selected" : ""}>${esc(d.name)}</option>`);
  $("rsess").innerHTML = o(R.sessions, x => `<option value="${x}" ${x === S.sess ? "selected" : ""}>${x}</option>`);
  $("rlevel").innerHTML = [100, 200, 300, 400].map(l => `<option value="${l}" ${l === S.level ? "selected" : ""}>${l} Level</option>`).join("");
  $("rsem").innerHTML = `<option value="first" ${S.sem === "first" ? "selected" : ""}>Harmattan Semester</option><option value="second" ${S.sem === "second" ? "selected" : ""}>Rain Semester</option>`;
}

async function doRegister(e) {
  e.preventDefault();
  const fail = m => { $("rerr").textContent = m; $("rgo").disabled = false; };
  const id = $("rid").value.trim().toUpperCase(), pw = $("rpw").value, S = window._reg.sel;
  if (pw !== $("rpw2").value) return fail("The two passwords do not match.");
  if (pw.length < 6) return fail("Use a password of at least 6 characters.");
  if (!S.dept) return fail("Choose your department. If none is listed for this school, ask the administrator.");
  const mode = $("rmode").value, route = $("rroute").value;
  if (mode === "degree") {
    const utme = /^EDUC[0-9]{7}$/.test(id), de = /^EDUC[0-9]{2}02[0-9]{5}$/.test(id);
    if (!utme && !de) return fail("A degree matric number must look like EDUC2510212 (UTME) or EDUC250210001 (Direct Entry). Check it and try again.");
    if (route === "utme" && !utme) return fail("You chose UTME, but this matric number has the Direct Entry pattern (EDUC + year + 02 + ...). Check how you were admitted or the matric number.");
    if (route === "direct_entry" && !de) return fail("You chose Direct Entry, but this matric number has the UTME pattern. Check how you were admitted or the matric number.");
    const admitted = (+String(S.sess).split("/")[0] - (S.level / 100 - 1)) % 100;
    if (+id.slice(4, 6) !== admitted) {
      const ok = confirm("Your matric number shows admission year 20" + id.slice(4, 6) + ", but you chose " + S.sess + ", " + S.level + " Level, which points to 20" + String(admitted).padStart(2, "0") + ". Continue anyway?");
      if (!ok) return fail("Please check your matric number, session and level, then try again.");
    }
  }
  $("rgo").disabled = true; $("rerr").textContent = "";
  const email = loginEmail(id).replace("@", "." + Math.random().toString(36).slice(2, 8) + "@");
  const { data, error } = await sb.auth.signUp({ email, password: pw });
  if (error) return fail("Your account could not be created: " + error.message);
  if (!data.session) return fail("Sign-up needs 'Confirm email' to be switched off in Supabase.");
  const { data: cid, error: ce } = await sb.rpc("ensure_class_profile", { p_dept: S.dept, p_level: S.level, p_session: S.sess, p_sem: S.sem });
  if (ce) { await sb.auth.signOut(); return fail(ce.message); }
  const { error: pe } = await sb.from("profiles").insert({
    id: data.user.id, auth_email: email, login_id: id, account_type: "student", full_name: $("rname").value.trim(),
    phone: $("rphone").value.trim() || null, department_id: S.dept, class_profile_id: cid,
    admission_route: $("rroute").value, study_mode: $("rmode").value, current_level: S.level, status: "pending" });
  if (pe) { await sb.auth.signOut(); return fail(/duplicate|unique/i.test(pe.message) ? "This matric number is already registered. Sign in instead, or ask your HOC/CG." : "Your details could not be saved: " + pe.message); }
  await loadMe();
}

/* ---------- HOC/CG and assistants: approvals, assistants, department list ---------- */

const pmsg = (ok, t) => { const el = $("pmsg"); if (el) { el.className = ok ? "muted" : "err"; el.textContent = t; } };
async function approve(id) {
  const { error } = await sb.rpc("approve_student", { p_student: id });
  await loadPending(); if (error) pmsg(false, error.message);
}
/* Lists are in serial order: the last three digits of the matric or DLAMS ID (EDUC2410002 -> 002) */
const serialNo = id => { const d = String(id || "").replace(/\D/g, "").slice(-3); return d ? parseInt(d, 10) : 1e9; };
const routeGroup = id => /^EDUC[0-9]{7}$/.test(String(id || "")) ? 0 : /^EDUC[0-9]{2}02[0-9]{5}$/.test(String(id || "")) ? 1 : 2;
const cmpNo = (a, b) => (routeGroup(a) - routeGroup(b)) || (serialNo(a) - serialNo(b)) || String(a).localeCompare(String(b));

/* Reasons for denying and removing students. The administrator and HOC/CG choose one; "other" needs a sentence. */
const DENY_REASONS = { incomplete: "Incomplete registration", wrong_details: "Wrong details", not_eligible: "Not eligible for this department", other: "Other" };
const REMOVE_REASONS = { withdrew: "Withdrew from the programme", transferred: "Transferred to another institution", duplicate: "Duplicate account", wrong_registration: "Registered in error", other: "Other" };
const ALL_REASONS = Object.assign({}, DENY_REASONS, REMOVE_REASONS);
function pickReason(map, verb) {
  const keys = Object.keys(map);
  const n = prompt(verb + " because:\n" + keys.map((k, i) => (i + 1) + ". " + map[k]).join("\n") + "\n\nType the number of the reason:");
  const key = keys[(+n) - 1];
  if (!key) return null;
  let note = null;
  if (key === "other") { note = prompt("Describe the reason in a sentence:"); if (!note || !note.trim()) return null; }
  return { key, note };
}

async function denyStudent(id) {
  const p = people.find(x => x.id === id);
  const rs = pickReason(DENY_REASONS, "Deny the registration of " + (p ? p.full_name : "this student"));
  if (!rs) return;
  const { error } = await sb.rpc("deny_student", { p_student: id, p_reason: rs.key, p_note: rs.note });
  await loadPending(); if (error) pmsg(false, error.message);
}
async function approveAll() {
  const fails = [];
  for (const p of people.filter(x => x.status === "pending")) {
    const { error } = await sb.rpc("approve_student", { p_student: p.id });
    if (error) fails.push(p.full_name + ": " + error.message);
  }
  await loadPending(); if (fails.length) pmsg(false, fails.join(" | "));
}

/* ---------- Student: scan the QR (the phone camera opens this page with ?s=...) ---------- */
const getPos = () => new Promise((res, rej) => navigator.geolocation
  ? navigator.geolocation.getCurrentPosition(p => res(p.coords),
      () => rej(new Error("Location is needed. Switch on location for this site, then try again.")),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 })
  : rej(new Error("This phone does not support location.")));

function renderScan() {
  show(`<h1>Register attendance</h1>
    <p class="muted">Stand inside the lecture room. DLAMS checks that you are close to the classroom.</p>
    <div class="panel"><div class="actions"><button class="primary" id="sgo" onclick="doScan()">Register my attendance</button>
    <button onclick="leaveScan()">Go to my dashboard</button></div><p id="sres" role="status"></p></div>`);
}
function leaveScan() { pendingToken = null; history.replaceState(null, "", location.pathname); renderHome(); }

async function doScan() {
  const r = $("sres"); $("sgo").disabled = true; r.className = ""; r.textContent = "Checking your location…";
  let pos;
  try { pos = await getPos(); } catch (e) { r.className = "err"; r.textContent = e.message; $("sgo").disabled = false; return; }
  const { data, error } = await sb.rpc("scan_attendance", { p_token: pendingToken, p_lat: pos.latitude, p_lng: pos.longitude });
  if (error) { r.className = "err"; r.textContent = error.message; $("sgo").disabled = false; return; }
  const why = {
    not_active: "Your account has not been approved yet. Ask your HOC/CG to approve it.",
    not_found: "This QR code is not valid.",
    closed: "This attendance session is not open right now. Ask your HOC/CG.",
    not_enrolled: "You are not enrolled in this course. If it is an extra course, add it from your dashboard first.",
    no_location: "Your location was not received. Switch on location and try again.",
    outside: "You appear to be outside the classroom (" + data.distance_m + " m away, limit " + data.radius_m + " m). Move closer to the room, switch on location and try again.",
    removed: "You were taken off this session's list. Please speak to your HOC/CG." };
  if (data.ok) { r.className = "ok"; r.textContent = (data.already ? "You are already marked present for " : "Attendance recorded for ") + data.course + " - " + data.title + "."; return; }
  r.className = "err"; r.textContent = why[data.reason] || "Attendance could not be recorded."; $("sgo").disabled = false;
}

let sessions = [], attRows = {}, rosters = {}, rosterAt = {}, ticks = {}, opens = new Set(), pollT = null, clockT = null, sigNow = "";
const effStatus = s => (s.status === "active" && new Date(s.active_until).getTime() < Date.now()) ? "timeup" : s.status;
const canReopen = s => s.status === "stopped" && s.stopped_at && Date.now() - new Date(s.stopped_at).getTime() < 300000;
const sig = () => sessions.map(s => s.id + effStatus(s) + (canReopen(s) ? "r" : "") + s.active_until).join("|");

const gmsg = (ok, t) => { const el = $("gmsg"); if (el) { el.className = ok ? "ok" : "err"; el.textContent = t || ""; } };

function qrImg(token) {
  const q = qrcode(0, "M"); q.addData(location.origin + location.pathname + "?s=" + token); q.make();
  return q.createImgTag(8, 4, "QR code for attendance");

async function loadSessions() {
  const since = new Date(Date.now() - 2 * 864e5).toISOString();
  const { data } = await sb.from("sessions").select("*, courses(course_code,course_title,study_mode)")
    .in(me.hoc ? "class_profile_id" : "course_id", me.hoc ? [me.hoc.class_profile_id] : (window._myCourseIds || [])).in("status", ["inactive", "active", "paused", "stopped"])
    .gte("created_at", since).order("created_at", { ascending: false });
  sessions = data || [];
  const live = sessions.filter(s => s.status !== "inactive"), ids = live.map(s => s.id);
  for (const cid of [...new Set(live.map(s => s.course_id))]) {
    if (!rosters[cid] || Date.now() - (rosterAt[cid] || 0) > 30000) {
      const { data: r } = await sb.rpc("course_roster", { p_course: cid }); rosters[cid] = r || []; rosterAt[cid] = Date.now(); }
  }
  attRows = {};
  if (ids.length) {
    const { data: a } = await sb.from("attendance")
      .select("session_id,student_id,status,method,scanned_at,profiles!student_id(full_name,login_id)")
      .in("session_id", ids).order("scanned_at");
    (a || []).forEach(r => (attRows[r.session_id] = attRows[r.session_id] || []).push(r));
  }
}

  if (st === "active") return `<div class="qr">${qrImg(s.qr_token)}</div>

      <td>${r.method === "assisted" ? '<span class="flag">Marked by hand</span>' : ""}</td>
      <td><button onclick="removeAtt('${s.id}','${r.student_id}')">Remove</button></td></tr>`).join("")}</table></div>` : ""}

      ${others.length ? others.map(p => `<label class="check"><input type="checkbox" ${t.has(p.student_id) ? "checked" : ""} onchange="tick('${s.id}','${p.student_id}',this.checked)">

const STLABEL = { inactive: "Not active yet", active: "QR is open", timeup: "Time ended", paused: "Paused", stopped: "Stopped" };
function drawSessions() {
  sigNow = sig();
  $("slist").innerHTML = sessions.length ? sessions.map(s => `<div class="panel sess">
      <strong>${esc(s.courses.course_code)}</strong> ${esc(s.courses.course_title)}<br><span class="muted">${esc(s.label)} - ${STLABEL[effStatus(s)]}</span>
      <div>${ctlHtml(s)}</div><div id="live-${s.id}">${liveHtml(s)}</div></div>`).join("") : "";
  clock();
}
function drawLive() { sessions.forEach(s => { const el = $("live-" + s.id); if (el) el.innerHTML = liveHtml(s); }); }
function clock() {
  sessions.forEach(s => { const el = $("t" + s.id); if (!el) return;
    const ms = new Date(s.active_until) - Date.now();
    el.textContent = ms > 0 ? Math.floor(ms / 60000) + ":" + String(Math.floor(ms / 1000) % 60).padStart(2, "0") : "0:00"; });
  if (sig() !== sigNow) drawSessions();
}
async function poll() { await loadSessions(); sig() !== sigNow ? drawSessions() : drawLive(); }
async function startSessions() { stopTimers(); await loadSessions(); drawSessions(); pollT = setInterval(poll, 4000); clockT = setInterval(clock, 1000); }

const toggleOpen = (id, o) => o ? opens.add(id) : opens.delete(id);
const tick = (sid, pid, on) => { const t = (ticks[sid] = ticks[sid] || new Set()); on ? t.add(pid) : t.delete(pid); };

async function run(fn, args, okText) {
  const { error } = await sb.rpc(fn, args);
  gmsg(!error, error ? error.message : okText);
  await poll(); return !error;
}
const act = (fn, id) => run(fn, { p_session: id });
const resume = id => run("resume_session", { p_session: id, p_minutes: +$("m" + id).value || null });
const reopen = id => run("reopen_session", { p_session: id });

const terminate = id => {
  const n = ((attRows[id] || []).filter(r => r.status === "present")).length;
  return confirm("Terminate this attendance session? It will be discarded and will not appear in any record." + (n ? " The " + n + " student(s) who already registered will not be counted." : "")) && run("cancel_session", { p_session: id }, "Session terminated.");
};
const cancelSession = id => confirm("Cancel this session?") && run("cancel_session", { p_session: id });
const removeAtt = (sid, pid) => confirm("Take this student off the list?") && run("remove_attendance", { p_session: sid, p_student: pid });
async function markTicked(sid) {
  const ids = [...(ticks[sid] || [])]; if (!ids.length) { gmsg(false, "Tick at least one student first."); return; }
  if (await run("mark_assisted_many", { p_session: sid, p_students: ids }, ids.length + " student(s) marked present.")) ticks[sid] = new Set();
}
async function activate(id) {

    await run("activate_session", { p_session: id, p_minutes: +$("m" + id).value, p_lat: pos.latitude, p_lng: pos.longitude, p_radius: +($("rad" + id) ? $("rad" + id).value : 300) || 300 }); }

const SESS_LABEL = { inactive: "Not started", active: "Open", paused: "Paused", stopped: "Stopped", finalised: "Finalised", cancelled: "Terminated" };

  const rows = data || [], ids = rows.map(r => r.id), cnt = {};

async function doChangePassword(e) {

/* Every list opens and closes: each heading becomes a dropdown section */
const tidyLists = root => root.querySelectorAll("h2").forEach(h => {
  if (h.dataset.dd) return; h.dataset.dd = "1";
  const d = document.createElement("details"); d.open = false; d.className = "dd";
  const sm = document.createElement("summary"); sm.textContent = h.textContent; d.appendChild(sm);
  const kids = []; let n = h.nextSibling;
  while (n && !(n.nodeType === 1 && n.tagName === "H2")) { kids.push(n); n = n.nextSibling; }
  h.replaceWith(d); kids.forEach(k => d.appendChild(k));
});
new MutationObserver(() => { tidyLists($("app")); addPrintButtons($("app")); }).observe($("app"), { childList: true, subtree: true });

function addPrintButtons(root) {
  root.querySelectorAll("table").forEach(t => {
    if (t.dataset.pr || t.closest("#regprint")) return;
    t.dataset.pr = "1";
    const b = document.createElement("button");
    b.textContent = "Print this list"; b.style.margin = "4px 0 8px";
    b.onclick = () => printTable(t);
    t.before(b);
  });
}
function printTable(t) {
  const d = t.closest("details"), title = d && d.querySelector("summary") ? d.querySelector("summary").textContent : document.title;
  const clone = t.cloneNode(true); clone.querySelectorAll("button").forEach(x => x.remove());
  const w = window.open("", "_blank");
  if (!w) { flashMsg("Allow pop-ups for this site to print."); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:12px Arial,sans-serif}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:4px 6px;text-align:left}th{background:#eee}h1{font-size:15px}</style></head><body><h1>${esc(title)}</h1>${clone.outerHTML}<script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}

async function loadScoped() {
  const box = $("scoped"); if (!box) return;
  const d = $("sc-d") ? $("sc-d").value : "";
  if (!d) { box.innerHTML = `<p class="panel">No department in your scope.</p>`; return; }
  const { data, error } = await sb.rpc("scoped_courses", { p_dept: d, p_mode: $("sc-m").value || null, p_level: $("sc-l").value ? +$("sc-l").value : null });
  if (error) { box.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  window._tools.courses = (window._tools.courses || []).filter(x => x.src !== "scoped").concat((data || []).map(x => Object.assign({ src: "scoped" }, x)));
  box.innerHTML = courseRows(data || []);
}
function groupCourses(list) {
  const out = [], seen = {};
  (list || []).forEach(c => {
    if (!c.catalogue_id) { out.push(c); return; }
    if (!seen[c.catalogue_id]) { seen[c.catalogue_id] = Object.assign({}, c, { taken: [] }); out.push(seen[c.catalogue_id]); }
    const g = seen[c.catalogue_id], label = c.class_dept || (c.class_label || "").split(",")[0];
    if (label && !g.taken.includes(label)) g.taken.push(label);
  });
  out.forEach(c => { if (c.taken) c.taken.sort(); });
  return out;
}

  box.innerHTML = courseRows(groupCourses(data || []));

  const { data, error } = await sb.rpc("reset_staff_password", { p_profile: id });
  flashMsg(error ? error.message : data);
}

/* Delete a lecturer account (for example a Sub-dean or HOD who is not teaching this semester) */
async function deleteStaff(id) {
  if (!confirm("Delete this lecturer account? Their courses become Unconfirmed. This cannot be undone.")) return;
  const { data, error } = await sb.rpc("delete_staff_account", { p_profile: id });
  flashMsg(error ? error.message : data);
  if (!error) loadOversight();
}

/* Chat the administrator: a button at the lower left of every dashboard, with a limit on messages */
function ensureChatWidget() {
  if ($("chatw")) return;
  const w = document.createElement("div"); w.id = "chatw";
  w.style.cssText = "position:fixed;left:14px;bottom:14px;z-index:50;";
  w.innerHTML = `<button id="chatbtn" aria-label="Chat the administrator" title="Chat the administrator" onclick="toggleChat()"
      style="width:54px;height:54px;border-radius:50%;padding:0;font-size:1.4rem;box-shadow:0 2px 8px #0005">&#128172;</button>
    <div class="muted" style="font-size:.72rem;margin-top:4px;width:120px;line-height:1.2">Chat the administrator</div>
    <div id="chatpanel" hidden style="position:fixed;left:14px;bottom:100px;width:min(340px,92vw);max-height:62vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 4px 16px #0005"></div>`;
  document.body.appendChild(w);
}
async function toggleChat() {
  const p = $("chatpanel"); p.hidden = !p.hidden;
  if (!p.hidden) await loadChat();
}
async function loadChat() {
  const [mr, qr] = await Promise.all([sb.rpc("my_messages"), sb.rpc("my_message_quota")]);
  const q = qr.data && qr.data[0], left = q ? q.limit_n - q.used : 0, msgs = mr.data || [];
  $("chatpanel").innerHTML = `<strong>Messages to the administrator</strong>
    <p class="muted" style="margin:4px 0">${left > 0 ? left + " message" + (left === 1 ? "" : "s") + " left" : "You have used all your messages."}</p>
    <div style="max-height:34vh;overflow:auto;margin:6px 0">${msgs.length ? msgs.map(m => `<div style="margin:6px 0;${m.from_admin ? "" : "text-align:right"}">
      <span class="flag">${m.from_admin ? "Administrator" : "You"}</span><br>${esc(m.body).replace(/\n/g, "<br>")}</div>`).join("") : `<p class="muted">No messages yet.</p>`}</div>
    <textarea id="chattxt" rows="2" style="width:100%" ${left > 0 ? "" : "disabled"} placeholder="Write your question"></textarea>
    <div class="actions"><button class="primary" ${left > 0 ? "" : "disabled"} onclick="sendChat()">Send</button></div>
    <p id="chatmsg" role="status" class="muted"></p>`;
}
async function sendChat() {
  const { error } = await sb.rpc("send_message", { p_body: $("chattxt").value });
  if (error) { $("chatmsg").className = "err"; $("chatmsg").textContent = error.message; return; }
  loadChat();
}

/* ---------- Administrator dashboard: a sidebar, one section at a time ---------- */
const schoolOf = d => { const s = window._adm && window._adm.schools.find(x => x.id === d.school_id); return s ? s.name : ""; };
function hocName(cid) {
  const A = window._adm, r = (A.hocRoles || []).find(x => x.class_profile_id === cid);
  const p = r && (A.hocNames || []).find(x => x.id === r.profile_id);
  return p ? p.full_name + " (" + p.hoc_cg_id + ")" : "";
}
function admMsg(text, bad) {
  const p = $("admmsg"); if (!p) { flashMsg(text); return; }
  p.className = bad ? "err" : "ok"; p.style.whiteSpace = "pre-line"; p.textContent = text;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
async function admLoad() {
  const [sc, dp, cp, st, pd, ls, se, sf, un, gh, ib, hr] = await Promise.all([
    sb.from("schools").select("id,name,acronym").order("name"),
    sb.from("departments").select("id,name,code,school_id").order("name"),
    sb.from("class_profiles").select("id,department_id,school_id,programme,level,session,semester").order("level"),
    sb.from("profiles").select("id,login_id,full_name,phone,status,class_profile_id,admission_route,study_mode,current_level").eq("account_type", "student").order("login_id"),
    sb.from("profiles").select("id").eq("status", "pending").eq("account_type", "student"),
    sb.rpc("leaders_in_scope"),
    sb.from("academic_sessions").select("label").order("label", { ascending: false }),
    sb.rpc("staff_in_scope"), sb.rpc("unused_lecturer_accounts"),
    sb.from("general_hosts").select("department_id"),
    sb.rpc("admin_inbox"),
    sb.from("role_assignments").select("profile_id,class_profile_id").eq("role", "hoc_cg").eq("slot", "main").eq("is_active", true)]);
  const hocIds = (hr.data || []).map(r => r.profile_id);
  const hn = hocIds.length ? await sb.from("profiles").select("id,full_name,hoc_cg_id").in("id", hocIds) : { data: [] };
  window._adm = { schools: sc.data || [], depts: dp.data || [], classes: cp.data || [], students: st.data || [], pending: pd.data || [],
    leaders: ls.data || [], sessions: (se.data || []).map(x => x.label), staff: sf.data || [], unused: un.data || [],
    hosts: new Set((gh.data || []).map(x => x.department_id)), inbox: ib.data || [], hocRoles: hr.data || [], hocNames: hn.data || [] };
}

/* School first, then only that school's departments. Used everywhere a department is chosen. */
function normDepts(list) {
  return (list || []).map(d => ({ id: d.dept_id || d.id, name: d.dept_name || d.name, school_id: d.school_id, school_name: d.school_name || schoolOf(d) }));
}
function pickerHtml(p, depts, fn, selSchool, selDept) {
  const sch = [...new Map(depts.map(d => [d.school_id, { id: d.school_id, name: d.school_name || "" }])).values()]
    .filter(x => x.id).sort((a, b) => a.name.localeCompare(b.name));
  window._pick = window._pick || {};
  window._pick[p] = { depts, fn: fn || (() => {}) };
  const first = selSchool || (sch[0] ? sch[0].id : "");
  return `<div><label for="${p}-s">School</label><select id="${p}-s" onchange="refillPick('${p}')">${sch.map(x => `<option value="${x.id}" ${x.id === first ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
    <div><label for="${p}-d">Department</label><select id="${p}-d" onchange="pickDept('${p}')">${depts.filter(d => d.school_id === first).map(d => `<option value="${d.id}" ${d.id === selDept ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></div>`;
}
function refillPick(p) {
  const P = window._pick[p], sid = $(p + "-s").value;
  $(p + "-d").innerHTML = P.depts.filter(d => d.school_id === sid).map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join("")
    || `<option value="">No departments in this school</option>`;
  pickDept(p);
}

        <div><label for="tt-d">Day</label><select id="tt-d">${DAYS.slice(1).map((d, i) => `<option value="${i + 1}">${d}</option>`).join("")}</select></div>
        <div><label for="tt-s">Start</label><input id="tt-s" type="time"></div>

/* Attendance trend: one bar per finalised lecture, the 75% line, and the average */
async function drawTrend(cid, elId) {
  const el = $(elId); if (!el) return;
  const { data, error } = await sb.rpc("course_trend", { p_course: cid });
  el.innerHTML = error ? `<p class="err">${esc(error.message)}</p>` : trendSvgHtml(data || []);
}
function trendSvgHtml(rows) {
  if (!rows.length) return `<p class="muted">The trend appears after the first register is finalised.</p>`;
  const W = 640, H = 220, pad = 36, slot = (W - pad * 2) / rows.length, bw = Math.max(8, Math.min(40, slot - 6));
  const avg = rows.reduce((n, r) => n + (+r.pct || 0), 0) / rows.length;
  const y = v => H - pad - (v / 100) * (H - pad * 2);
  const bars = rows.map((r, i) => {
    const x = pad + i * slot + (slot - bw) / 2, v = +r.pct || 0;
    return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, H - pad - y(v))}" style="fill:var(--accent)">
      <title>${esc(r.session_label)}: ${v}% (${r.present} of ${r.enrolled})</title></rect>
      <text x="${x + bw / 2}" y="${H - pad + 14}" font-size="10" text-anchor="middle">L${i + 1}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Attendance per lecture">
    <line x1="${pad}" y1="${y(75)}" x2="${W - pad}" y2="${y(75)}" style="stroke:var(--bad);stroke-dasharray:4 4"/>
    <text x="${W - pad}" y="${y(75) - 4}" font-size="10" text-anchor="end">75%</text>
    <line x1="${pad}" y1="${y(avg)}" x2="${W - pad}" y2="${y(avg)}" style="stroke:var(--muted);stroke-dasharray:2 3"/>
    <text x="${pad}" y="${y(avg) - 4}" font-size="10">average ${avg.toFixed(1)}%</text>
    <line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" style="stroke:var(--line)"/>${bars}</svg>
    <p class="muted">Each bar is one finalised lecture. Hover a bar for the exact figures.</p>`;
}
function loadTrendPanel() {
  const el = $("trendbox"); if (!el) return;
  if (!isMain() || !saved.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<h2>Attendance trend</h2><div class="panel"><label for="trc">Course</label>
    <select id="trc" onchange="drawTrend(this.value, 'trout')">${saved.map(c => `<option value="${c.id}">${esc(c.course_code)} - ${esc(c.course_title)}</option>`).join("")}</select>
    <div id="trout" style="margin-top:10px"></div></div>`;
  drawTrend(saved[0].id, "trout");
}

/* Word: the register as a Word document (opens on any computer with Word or a free viewer) */
function downloadRegisterWord() {
  const sel = $("regc"), title = sel ? sel.options[sel.selectedIndex].text : "Register";
  const tbl = $("regprint") ? $("regprint").innerHTML : "";
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
    <head><meta charset="utf-8"><title>${esc(title)}</title><style>table{border-collapse:collapse}td,th{border:1px solid #000;padding:3px;font-size:10pt}</style></head>
    <body><h2>${esc(title)}</h2>${tbl}</body></html>`;
  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = title.replace(/[^A-Za-z0-9 _-]/g, "").trim() + " register.doc";
  document.body.appendChild(a); a.click(); a.remove();
}
